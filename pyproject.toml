[project]
name = "mcp-warehouse-adapters"
version = "0.1.0"
description = "Snowflake and Databricks warehouse adapters for cpg-analytics-mcp, with governance pushed down to the platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cpg-analytics-mcp",
    "cryptography>=43",
    "snowflake-connector-python>=3.12",
]

[project.entry-points."cpg_analytics_mcp.warehouses"]
snowflake = "mcp_warehouse_adapters.snowflake.warehouse:factory"

[project.scripts]
mwa-snowflake-load = "mcp_warehouse_adapters.snowflake.loader:main"

[tool.uv.sources]
cpg-analytics-mcp = { git = "https://github.com/sachingill/cpg-analytics-mcp", branch = "main" }

[build-system]
requires = ["uv_build>=0.11.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
